spring.application.name=AutoEscola3ESPH
server.port=8086

# Configuração do Banco de Dados H2 em Memória
spring.datasource.url=jdbc:h2:mem:autoescoladb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate configurado para criar as tabelas automaticamente no H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Habilita o console web do H2 para você visualizar o banco pelo navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

api.security.token.secret=12345678
